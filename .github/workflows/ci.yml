name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate local Piper bridge syntax
        run: python -m py_compile tools/piper-voice/server.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Validate production Docker image and bundled voice models
        run: docker build --pull --tag stickmotion-ai:ci .
      - name: Smoke-test hosted voice API in the production container
        run: |
          docker run --detach --name stickmotion-smoke --publish 10000:10000 stickmotion-ai:ci
          cleanup() { docker rm --force stickmotion-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/health > /tmp/stickmotion-health.json; then
              break
            fi
            sleep 2
          done
          python -c "import json; data=json.load(open('/tmp/stickmotion-health.json')); assert data['status'] == 'ready', data"
          curl --fail --silent --show-error http://127.0.0.1:10000/api/tts -H 'Content-Type: application/json' --data-binary '{"text":"Welcome to StickMotion AI.","language":"en","style":"documentary","rate":1.0}' --output /tmp/stickmotion-en.wav
          curl --fail --silent --show-error http://127.0.0.1:10000/api/tts -H 'Content-Type: application/json' --data-binary '{"text":"مرحباً بكم في ستيك موشن.","language":"ar","style":"documentary","rate":1.0}' --output /tmp/stickmotion-ar.wav
          python -c "import wave; files=['/tmp/stickmotion-en.wav','/tmp/stickmotion-ar.wav']; [(_ for _ in ()).throw(AssertionError(path)) if wave.open(path).getnframes() <= 0 else None for path in files]"
