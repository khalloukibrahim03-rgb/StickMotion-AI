services:
  - type: web
    name: stickmotion-ai
    branch: development
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: WEB_DIST_DIR
        value: /app/dist
